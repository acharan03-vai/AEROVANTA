<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Astra 3D Flight Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #020617;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Flight HUD Overlay */
        #hud-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 18px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            width: 290px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
            transition: opacity 0.5s ease;
        }

        h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 13px;
            color: #94a3b8;
        }

        .data-val {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            color: #34d399;
        }

        button.btn-primary {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            transition: all 0.2s ease;
        }

        button.btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
        }

        .controls-hint {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            color: #64748b;
            line-height: 1.5;
        }

        .controls-hint b { color: #38bdf8; }

        /* Intro Overlay Screen */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(2,6,23,0.85) 100%);
        }

        #intro-title {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        #intro-subtitle {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        #launch-btn {
            pointer-events: auto;
            padding: 16px 40px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: #020617;
            background: #38bdf8;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            transition: all 0.3s ease;
        }

        #launch-btn:hover {
            scale: 1.05;
            background: #7dd3fc;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.9);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="intro-overlay">
        <h1 id="intro-title">AERO ASTRA</h1>
        <p id="intro-subtitle">FLIGHT SIMULATOR & HARDWARE CONTROL</p>
        <button id="launch-btn">INITIALIZE SYSTEM</button>
    </div>

    <div id="hud-container" style="opacity: 0; pointer-events: none;">
        <h2>FLIGHT TELEMETRY</h2>
        <div class="data-row">Speed: <span id="speed-val" class="data-val">0 KM/H</span></div>
        <div class="data-row">Pitch: <span id="pitch-val" class="data-val">0.00°</span></div>
        <div class="data-row">Roll: <span id="roll-val" class="data-val">0.00°</span></div>
        <div class="data-row">Yaw: <span id="yaw-val" class="data-val">0.00°</span></div>
        <div class="data-row">Hardware: <span id="status-val" class="data-val" style="color:#f59e0b;">Awaiting USB</span></div>

        <button class="btn-primary" id="connect-btn">CONNECT ESP32 (SERIAL)</button>

        <div class="controls-hint">
            <b>KEYBOARD CONTROLS:</b><br>
            • <b>W / S</b>: Throttle / Speed<br>
            • <b>Up / Down</b>: Pitch Nose Down / Up<br>
            • <b>Left / Right</b>: Roll Wing Left / Right<br>
            • <b>A / D</b>: Yaw Rudder Left / Right
        </div>
    </div>

    <script>
        // --- 1. THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);
        scene.fog = new THREE.FogExp2(0x020617, 0.008);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.set(30, 80, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const cityGlowLight = new THREE.DirectionalLight(0x3b82f6, 1.2);
        cityGlowLight.position.set(-30, -10, -30);
        scene.add(cityGlowLight);

        // --- 3. PROCEDURAL 3D CITY GENERATION ---
        const cityGroup = new THREE.Group();
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.2 });
        const windowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

        const citySize = 300;
        const buildingCount = 140;

        for (let i = 0; i < buildingCount; i++) {
            const h = Math.random() * 25 + 8;
            const w = Math.random() * 6 + 4;
            const d = Math.random() * 6 + 4;

            const bGeo = new THREE.BoxGeometry(w, h, d);
            const building = new THREE.Mesh(bGeo, buildingMat);

            let x = (Math.random() - 0.5) * citySize;
            let z = (Math.random() - 0.5) * citySize;

            // Keep runway path clear in middle
            if (Math.abs(x) < 12) x += (x < 0 ? -15 : 15);

            building.position.set(x, h / 2 - 4, z);
            building.castShadow = true;
            building.receiveShadow = true;
            cityGroup.add(building);
        }

        // Central Runway / Highway Grid
        const grid = new THREE.GridHelper(400, 100, 0x38bdf8, 0x1e293b);
        grid.position.y = -4;
        cityGroup.add(grid);

        scene.add(cityGroup);

        // --- 4. HIGH-DETAIL AIRCRAFT ---
        const jetGroup = new THREE.Group();
        const jetBodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.85, roughness: 0.25 });
        const accentMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.6, roughness: 0.3 });

        // Nose
        const noseGeo = new THREE.ConeGeometry(0.7, 3.5, 32);
        const nose = new THREE.Mesh(noseGeo, jetBodyMat);
        nose.rotation.x = Math.PI / 2;
        nose.position.z = 2.5;
        jetGroup.add(nose);

        // Fuselage
        const midGeo = new THREE.CylinderGeometry(0.7, 0.8, 4.5, 32);
        const midBody = new THREE.Mesh(midGeo, jetBodyMat);
        midBody.rotation.x = Math.PI / 2;
        midBody.position.z = -1.25;
        jetGroup.add(midBody);

        // Glass Cockpit
        const cockpitGeo = new THREE.SphereGeometry(0.5, 32, 16);
        const cockpitMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, metalness: 0.1, roughness: 0.1, transmission: 0.85, transparent: true });
        const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
        cockpit.scale.set(0.9, 0.7, 2.2);
        cockpit.position.set(0, 0.55, 1.2);
        jetGroup.add(cockpit);

        // Wings
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(4.2, -2.5);
        wingShape.lineTo(4.0, -3.5);
        wingShape.lineTo(0, -1.8);
        wingShape.closePath();
        const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.08, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 });

        const rightWing = new THREE.Mesh(wingGeo, accentMat);
        rightWing.rotation.x = Math.PI / 2;
        rightWing.position.set(0, 0, 0.8);
        jetGroup.add(rightWing);

        const leftWing = rightWing.clone();
        leftWing.scale.x = -1;
        jetGroup.add(leftWing);

        // Tail Fins
        const tailGeo = new THREE.BoxGeometry(0.06, 1.4, 1.2);
        const leftTail = new THREE.Mesh(tailGeo, accentMat);
        leftTail.position.set(-0.8, 1.0, -3.0);
        leftTail.rotation.z = -Math.PI / 12;
        jetGroup.add(leftTail);

        const rightTail = leftTail.clone();
        rightTail.position.x = 0.8;
        rightTail.rotation.z = Math.PI / 12;
        jetGroup.add(rightTail);

        // Thruster Flames
        const flameGeo = new THREE.ConeGeometry(0.25, 2.0, 16);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 });
        const leftFlame = new THREE.Mesh(flameGeo, flameMat);
        leftFlame.rotation.x = -Math.PI / 2;
        leftFlame.position.set(-0.55, -0.1, -4.5);
        jetGroup.add(leftFlame);

        const rightFlame = leftFlame.clone();
        rightFlame.position.x = 0.55;
        jetGroup.add(rightFlame);

        jetGroup.scale.set(0, 0, 0); // Hide during intro
        scene.add(jetGroup);

        // --- 5. ASTRA INTRO PARTICLES ---
        const PARTICLE_COUNT = 5000;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const radius = Math.random() * 25 + 2;
            const spin = radius * 0.8;
            const angle = Math.random() * Math.PI * 2;

            positions[i * 3] = Math.cos(angle + spin) * radius + (Math.random() - 0.5) * 4;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 6;
            positions[i * 3 + 2] = Math.sin(angle + spin) * radius + (Math.random() - 0.5) * 4;

            targetPositions[i * 3] = (Math.random() - 0.5) * 3;
            targetPositions[i * 3 + 1] = (Math.random() - 0.5) * 1.5;
            targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 5;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.12, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- 6. INTRO TRANSITION ---
        let isAssembling = false;
        let assemblyProgress = 0;
        let isSystemReady = false;

        document.getElementById('launch-btn').addEventListener('click', () => {
            document.getElementById('intro-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('intro-overlay').style.display = 'none', 500);

            const hud = document.getElementById('hud-container');
            hud.style.opacity = '1';
            hud.style.pointerEvents = 'auto';

            isAssembling = true;
        });

        // --- 7. INPUT ENGINE (KEYBOARD + ESP32 HARDWARE) ---
        let targetPitch = 0, targetRoll = 0, targetYaw = 0;
        let currentPitch = 0, currentRoll = 0, currentYaw = 0;
        let speed = 60; // KM/H base speed

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function handleKeyboardInput() {
            if (!isSystemReady) return;

            // Throttle Controls
            if (keys['KeyW']) speed = Math.min(240, speed + 1.2);
            if (keys['KeyS']) speed = Math.max(0, speed - 1.2);

            // Pitch Controls
            if (keys['ArrowUp']) targetPitch = Math.max(-60, targetPitch - 1.5);
            else if (keys['ArrowDown']) targetPitch = Math.min(60, targetPitch + 1.5);
            else if (!espConnected) targetPitch *= 0.95;

            // Roll Controls
            if (keys['ArrowLeft']) targetRoll = Math.max(-60, targetRoll - 2.0);
            else if (keys['ArrowRight']) targetRoll = Math.min(60, targetRoll + 2.0);
            else if (!espConnected) targetRoll *= 0.95;

            // Yaw Controls
            if (keys['KeyA']) targetYaw -= 1.0;
            if (keys['KeyD']) targetYaw += 1.0;
        }

        // ESP32 Serial Integration
        let espConnected = false;
        document.getElementById('connect-btn').addEventListener('click', async () => {
            if ('serial' in navigator) {
                try {
                    const port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                    espConnected = true;

                    const status = document.getElementById('status-val');
                    status.innerText = "ACTIVE LINK";
                    status.style.color = "#34d399";

                    const textDecoder = new TextDecoderStream();
                    port.readable.pipeTo(textDecoder.writable);
                    const reader = textDecoder.readable.getReader();

                    let buffer = "";
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buffer += value;
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            const parts = line.trim().split(',');
                            parts.forEach(part => {
                                const [k, v] = part.split(':');
                                if (k === 'P') targetPitch = parseFloat(v) || 0;
                                if (k === 'R') targetRoll = parseFloat(v) || 0;
                                if (k === 'Y') targetYaw = parseFloat(v) || 0;
                            });
                        }
                    }
                } catch (e) {
                    alert("Serial connection failed or cancelled.");
                }
            } else {
                alert("Web Serial API is not supported in this browser.");
            }
        });

        // --- 8. RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (!isSystemReady) {
                particleSystem.rotation.y = elapsedTime * 0.15;
            }

            if (isAssembling && assemblyProgress < 1.0) {
                assemblyProgress += 0.015;
                const posAttr = particleGeo.attributes.position;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    let px = posAttr.getX(i), py = posAttr.getY(i), pz = posAttr.getZ(i);
                    let tx = targetPositions[i * 3], ty = targetPositions[i * 3 + 1], tz = targetPositions[i * 3 + 2];
                    posAttr.setXYZ(i, px + (tx - px) * 0.08, py + (ty - py) * 0.08, pz + (tz - pz) * 0.08);
                }
                posAttr.needsUpdate = true;

                const scaleVal = Math.min(1.0, assemblyProgress * 1.2);
                jetGroup.scale.set(scaleVal, scaleVal, scaleVal);

                if (assemblyProgress >= 0.95) {
                    isSystemReady = true;
                    scene.remove(particleSystem);
                }
            }

            handleKeyboardInput();

            // Smooth orientation interpolation
            currentPitch += (targetPitch - currentPitch) * 0.08;
            currentRoll += (targetRoll - currentRoll) * 0.08;
            currentYaw += (targetYaw - currentYaw) * 0.08;

            if (isSystemReady) {
                jetGroup.rotation.x = THREE.MathUtils.degToRad(currentPitch);
                jetGroup.rotation.z = THREE.MathUtils.degToRad(-currentRoll);
                jetGroup.rotation.y = THREE.MathUtils.degToRad(currentYaw);

                // Continuous City Endless Forward Flight Simulation
                cityGroup.position.z += (speed / 3.6) * 0.015;
                if (cityGroup.position.z > 100) {
                    cityGroup.position.z = 0; // Infinite loop resetting
                }

                // Jet body dynamic vibration
                jetGroup.position.y = Math.sin(elapsedTime * 4) * 0.08;
                leftFlame.scale.z = 0.8 + (speed / 200) + Math.sin(elapsedTime * 20) * 0.2;
                rightFlame.scale.z = leftFlame.scale.z;
            }

            // Update Telemetry HUD
            document.getElementById('speed-val').innerText = Math.round(speed) + " KM/H";
            document.getElementById('pitch-val').innerText = currentPitch.toFixed(2) + "°";
            document.getElementById('roll-val').innerText = currentRoll.toFixed(2) + "°";
            document.getElementById('yaw-val').innerText = currentYaw.toFixed(2) + "°";

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
