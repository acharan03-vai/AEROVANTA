<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic ESP32 Flight Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #030712;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f3f4f6;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay UI HUD */
        #hud-container {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            width: 280px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease;
        }

        h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
            font-size: 13px;
            color: #94a3b8;
        }

        .data-val {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            color: #34d399;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            transition: all 0.2s ease;
        }

        button.btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
        }

        .manual-controls {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .manual-controls label {
            display: block;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input[type=range] {
            width: 100%;
            margin-bottom: 8px;
            accent-color: #38bdf8;
        }

        /* Intro Overlay Screen */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(3,7,18,0.8) 100%);
        }

        #intro-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        #intro-subtitle {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        #launch-btn {
            pointer-events: auto;
            padding: 16px 40px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: #030712;
            background: #38bdf8;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            transition: all 0.3s ease;
        }

        #launch-btn:hover {
            scale: 1.05;
            background: #7dd3fc;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.9);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="intro-overlay">
        <h1 id="intro-title">AERO ASTRA</h1>
        <p id="intro-subtitle">HARDWARE ORIENTATION SIMULATOR</p>
        <button id="launch-btn">INITIALIZE SYSTEM</button>
    </div>

    <div id="hud-container" style="opacity: 0; pointer-events: none;">
        <h2>TELEMETRY HUD</h2>
        <div class="data-row">Pitch: <span id="pitch-val" class="data-val">0.00°</span></div>
        <div class="data-row">Roll: <span id="roll-val" class="data-val">0.00°</span></div>
        <div class="data-row">Yaw: <span id="yaw-val" class="data-val">0.00°</span></div>
        <div class="data-row">Link Status: <span id="status-val" class="data-val" style="color:#f59e0b;">Awaiting USB</span></div>

        <button class="btn-primary" id="connect-btn">CONNECT ESP32 (SERIAL)</button>

        <div class="manual-controls">
            <label>Manual Pitch</label>
            <input type="range" id="pitch-slider" min="-90" max="90" value="0" step="0.5">

            <label>Manual Roll</label>
            <input type="range" id="roll-slider" min="-90" max="90" value="0" step="0.5">

            <label>Manual Yaw</label>
            <input type="range" id="yaw-slider" min="-180" max="180" value="0" step="0.5">
        </div>
    </div>

    <script>
        // --- 1. THREE.JS INITIALIZATION ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);
        scene.fog = new THREE.FogExp2(0x030712, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- 2. CINEMATIC LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0001;
        scene.add(sunLight);

        const blueRimLight = new THREE.DirectionalLight(0x0284c7, 2.5);
        blueRimLight.position.set(-30, -10, -30);
        scene.add(blueRimLight);

        // Ground Plane Grid
        const grid = new THREE.GridHelper(300, 150, 0x38bdf8, 0x1e293b);
        grid.position.y = -4;
        scene.add(grid);

        // --- 3. HIGH-REALISM JET AIRCRAFT GEOMETRY ---
        const jetGroup = new THREE.Group();

        // Main Metallic Material
        const jetBodyMat = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            metalness: 0.85,
            roughness: 0.25,
            envMapIntensity: 1.0
        });

        const accentMat = new THREE.MeshStandardMaterial({
            color: 0x0284c7,
            metalness: 0.6,
            roughness: 0.3
        });

        // Fuselage Body
        const noseGeo = new THREE.ConeGeometry(0.7, 3.5, 32);
        const nose = new THREE.Mesh(noseGeo, jetBodyMat);
        nose.rotation.x = Math.PI / 2;
        nose.position.z = 2.5;
        nose.castShadow = true;
        jetGroup.add(nose);

        const midGeo = new THREE.CylinderGeometry(0.7, 0.8, 4.5, 32);
        const midBody = new THREE.Mesh(midGeo, jetBodyMat);
        midBody.rotation.x = Math.PI / 2;
        midBody.position.z = -1.25;
        midBody.castShadow = true;
        jetGroup.add(midBody);

        // Glass Cockpit
        const cockpitGeo = new THREE.SphereGeometry(0.5, 32, 16);
        const cockpitMat = new THREE.MeshPhysicalMaterial({
            color: 0x38bdf8,
            metalness: 0.1,
            roughness: 0.1,
            transmission: 0.85,
            opacity: 1,
            transparent: true
        });
        const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
        cockpit.scale.set(0.9, 0.7, 2.2);
        cockpit.position.set(0, 0.55, 1.2);
        jetGroup.add(cockpit);

        // Wings
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(4.2, -2.5);
        wingShape.lineTo(4.0, -3.5);
        wingShape.lineTo(0, -1.8);
        wingShape.closePath();

        const extrudeSettings = { depth: 0.08, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
        const wingGeo = new THREE.ExtrudeGeometry(wingShape, extrudeSettings);

        const rightWing = new THREE.Mesh(wingGeo, accentMat);
        rightWing.rotation.x = Math.PI / 2;
        rightWing.position.set(0, 0, 0.8);
        rightWing.castShadow = true;
        jetGroup.add(rightWing);

        const leftWing = rightWing.clone();
        leftWing.scale.x = -1;
        jetGroup.add(leftWing);

        // Twin Tail Fins
        const tailGeo = new THREE.BoxGeometry(0.06, 1.4, 1.2);
        const leftTail = new THREE.Mesh(tailGeo, accentMat);
        leftTail.position.set(-0.8, 1.0, -3.0);
        leftTail.rotation.z = -Math.PI / 12;
        leftTail.castShadow = true;
        jetGroup.add(leftTail);

        const rightTail = leftTail.clone();
        rightTail.position.x = 0.8;
        rightTail.rotation.z = Math.PI / 12;
        jetGroup.add(rightTail);

        // Glowing Engine Thrusters
        const engineGeo = new THREE.CylinderGeometry(0.35, 0.3, 1.2, 32);
        const thrusterMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1 });
        
        const leftEngine = new THREE.Mesh(engineGeo, thrusterMat);
        leftEngine.rotation.x = Math.PI / 2;
        leftEngine.position.set(-0.55, -0.1, -3.2);
        jetGroup.add(leftEngine);

        const rightEngine = leftEngine.clone();
        rightEngine.position.x = 0.55;
        jetGroup.add(rightEngine);

        // Afterburner Glowing Plasma
        const flameGeo = new THREE.ConeGeometry(0.25, 2.0, 16);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 });
        
        const leftFlame = new THREE.Mesh(flameGeo, flameMat);
        leftFlame.rotation.x = -Math.PI / 2;
        leftFlame.position.set(-0.55, -0.1, -4.5);
        jetGroup.add(leftFlame);

        const rightFlame = leftFlame.clone();
        rightFlame.position.x = 0.55;
        jetGroup.add(rightFlame);

        jetGroup.scale.set(0, 0, 0); // Hide initial plane for intro particle assembly
        scene.add(jetGroup);

        // --- 4. ASTRA GALAXY/STARS PARTICLE ASSEMBLY INTRO ---
        const PARTICLE_COUNT = 5000;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // Initial Galaxy Spiral Layout
            const radius = Math.random() * 25 + 2;
            const spin = radius * 0.8;
            const angle = Math.random() * Math.PI * 2;

            positions[i * 3] = Math.cos(angle + spin) * radius + (Math.random() - 0.5) * 4;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 6;
            positions[i * 3 + 2] = Math.sin(angle + spin) * radius + (Math.random() - 0.5) * 4;

            // Target compressed positions for assembly transformation
            targetPositions[i * 3] = (Math.random() - 0.5) * 3;
            targetPositions[i * 3 + 1] = (Math.random() - 0.5) * 1.5;
            targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 5;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMat = new THREE.PointsMaterial({
            color: 0x38bdf8,
            size: 0.12,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- 5. INTRO ANIMATION STATE ENGINE ---
        let isAssembling = false;
        let assemblyProgress = 0;
        let isSystemReady = false;

        document.getElementById('launch-btn').addEventListener('click', () => {
            document.getElementById('intro-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('intro-overlay').style.display = 'none', 500);

            const hud = document.getElementById('hud-container');
            hud.style.opacity = '1';
            hud.style.pointerEvents = 'auto';

            isAssembling = true;
        });

        // --- 6. SERIAL DATA STREAMING HANDLING ---
        let targetPitch = 0, targetRoll = 0, targetYaw = 0;
        let currentPitch = 0, currentRoll = 0, currentYaw = 0;

        document.getElementById('connect-btn').addEventListener('click', async () => {
            if ('serial' in navigator) {
                try {
                    const port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });

                    const status = document.getElementById('status-val');
                    status.innerText = "ACTIVE LINK";
                    status.style.color = "#34d399";

                    const textDecoder = new TextDecoderStream();
                    port.readable.pipeTo(textDecoder.writable);
                    const reader = textDecoder.readable.getReader();

                    let buffer = "";
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buffer += value;
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            // Expected string: P:<pitch>,R:<roll>,Y:<yaw>
                            const parts = line.trim().split(',');
                            parts.forEach(part => {
                                const [k, v] = part.split(':');
                                if (k === 'P') targetPitch = parseFloat(v) || 0;
                                if (k === 'R') targetRoll = parseFloat(v) || 0;
                                if (k === 'Y') targetYaw = parseFloat(v) || 0;
                            });
                        }
                    }
                } catch (e) {
                    alert("Serial connection failed or cancelled.");
                }
            } else {
                alert("Web Serial API is not supported in this browser. Use Google Chrome or MS Edge.");
            }
        });

        // Sliders
        document.getElementById('pitch-slider').addEventListener('input', e => targetPitch = parseFloat(e.target.value));
        document.getElementById('roll-slider').addEventListener('input', e => targetRoll = parseFloat(e.target.value));
        document.getElementById('yaw-slider').addEventListener('input', e => targetYaw = parseFloat(e.target.value));

        // --- 7. MAIN RENDER ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Particle Galaxy Rotation before assembly
            if (!isSystemReady) {
                particleSystem.rotation.y = elapsedTime * 0.15;
            }

            // Assembly Transition Engine
            if (isAssembling && assemblyProgress < 1.0) {
                assemblyProgress += 0.015;

                const posAttr = particleGeo.attributes.position;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    let px = posAttr.getX(i);
                    let py = posAttr.getY(i);
                    let pz = posAttr.getZ(i);

                    let tx = targetPositions[i * 3];
                    let ty = targetPositions[i * 3 + 1];
                    let tz = targetPositions[i * 3 + 2];

                    posAttr.setXYZ(i, px + (tx - px) * 0.08, py + (ty - py) * 0.08, pz + (tz - pz) * 0.08);
                }
                posAttr.needsUpdate = true;

                // Scale up aircraft as galaxy condenses
                const scaleVal = Math.min(1.0, assemblyProgress * 1.2);
                jetGroup.scale.set(scaleVal, scaleVal, scaleVal);

                if (assemblyProgress >= 0.95) {
                    isSystemReady = true;
                    scene.remove(particleSystem); // Clean up particle system memory
                }
            }

            // Smooth Interpolation of Telemetry (Aerodynamic damping effect)
            currentPitch += (targetPitch - currentPitch) * 0.08;
            currentRoll += (targetRoll - currentRoll) * 0.08;
            currentYaw += (targetYaw - currentYaw) * 0.08;

            if (isSystemReady) {
                jetGroup.rotation.x = THREE.MathUtils.degToRad(currentPitch);
                jetGroup.rotation.z = THREE.MathUtils.degToRad(-currentRoll);
                jetGroup.rotation.y = THREE.MathUtils.degToRad(currentYaw);

                // Dynamic subtle engine floating vibration
                jetGroup.position.y = Math.sin(elapsedTime * 3) * 0.1;
                
                // Afterburner flicker pulse
                leftFlame.scale.z = 0.8 + Math.sin(elapsedTime * 20) * 0.2;
                rightFlame.scale.z = leftFlame.scale.z;
            }

            // Update UI HUD Text
            document.getElementById('pitch-val').innerText = currentPitch.toFixed(2) + "°";
            document.getElementById('roll-val').innerText = currentRoll.toFixed(2) + "°";
            document.getElementById('yaw-val').innerText = currentYaw.toFixed(2) + "°";

            renderer.render(scene, camera);
        }

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
