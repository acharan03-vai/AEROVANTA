<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Lab - MPU Controller Flight Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* TOP HEADER BAR (From Reference) */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(10, 15, 25, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            backdrop-filter: blur(8px);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1.5px;
            color: #ccff00;
        }

        .brand-sub {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        .telemetry-group {
            display: flex;
            gap: 22px;
            font-family: monospace;
        }

        .telem-box {
            text-align: right;
        }

        .telem-lbl {
            font-size: 9px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .telem-val {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        /* BOTTOM CONTROL BAR (From Reference) */
        #bottom-bar {
            position: absolute;
            bottom: 12px;
            left: 18px;
            z-index: 10;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .ctrl-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }

        .btn-connect {
            background: #a3e635;
            color: #0f172a;
            border: none;
            font-weight: 800;
        }
        .btn-connect:hover { background: #bef264; }

        /* SCORE & STATUS OVERLAYS */
        #score-display {
            position: absolute;
            top: 58px;
            right: 18px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.75);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-align: right;
            backdrop-filter: blur(4px);
        }

        .score-val { font-family: monospace; font-size: 20px; font-weight: 800; color: #00f0ff; }

        /* GAME OVER SCREEN */
        #gameover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 30;
            background: rgba(15, 23, 42, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .go-title {
            font-size: 42px;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .go-sub { font-size: 16px; color: #cbd5e1; margin-bottom: 24px; font-family: monospace; }

        .btn-restart-large {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            transition: transform 0.2s ease;
        }
        .btn-restart-large:hover { transform: scale(1.05); }

        #controls-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            border: 1px solid #38bdf8;
            padding: 20px 30px;
            border-radius: 8px;
            z-index: 40;
            display: none;
            width: 320px;
        }

        #controls-modal h3 { color: #38bdf8; margin-bottom: 12px; font-size: 16px; }
        #controls-modal p { font-size: 12px; color: #94a3b8; line-height: 1.8; margin-bottom: 16px; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- TOP HEADER TELEMETRY (Reference Matching) -->
    <div id="top-bar">
        <div class="brand-title">
            <span>ARMY</span>
            <span class="brand-sub">/ FLIGHT LAB</span>
        </div>

        <div class="telemetry-group">
            <div class="telem-box">
                <div class="telem-lbl">AIRSPEED</div>
                <div id="speed-val" class="telem-val">288 km/h</div>
            </div>
            <div class="telem-box">
                <div class="telem-lbl">ALTITUDE</div>
                <div id="alt-val" class="telem-val">35 m</div>
            </div>
            <div class="telem-box">
                <div class="telem-lbl">HEADING</div>
                <div id="heading-val" class="telem-val">003°</div>
            </div>
        </div>
    </div>

    <!-- SCORE BOARD -->
    <div id="score-display">
        <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">DISTANCE</div>
        <div id="score-val" class="score-val">0 m</div>
    </div>

    <!-- BOTTOM CONTROL BAR (Reference Matching) -->
    <div id="bottom-bar">
        <button class="ctrl-btn btn-connect" id="connect-btn">Connect Serial</button>
        <button class="ctrl-btn" id="recenter-btn">Centre Controller</button>
        <button class="ctrl-btn" id="view-btn">View: TPP</button>
        <button class="ctrl-btn" id="pause-btn">Pause</button>
        <button class="ctrl-btn" id="restart-bar-btn">Restart</button>
        <button class="ctrl-btn" id="controls-btn">Controls</button>
    </div>

    <!-- CONTROLS POPUP MODAL -->
    <div id="controls-modal">
        <h3>FLIGHT CONTROLS</h3>
        <p>
            • <b>Arrow Left / Right (or A/D)</b>: Roll & Turn Left/Right<br>
            • <b>Arrow Up / Down (or W/S)</b>: Pitch Nose Down/Up<br>
            • <b>MPU6050 Hardware</b>: Connect serial to fly via gyro sensor!
        </p>
        <button class="ctrl-btn" style="width:100%" id="close-modal-btn">Close</button>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameover-overlay">
        <div class="go-title">SYSTEM CRASHED</div>
        <div class="go-sub" id="final-dist-txt">DISTANCE: 0 M</div>
        <button class="btn-restart-large" id="restart-overlay-btn">RESTART FLIGHT</button>
    </div>

    <script>
        // --- 1. SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Light Blue Sky as seen in reference
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        let cameraMode = 'TPP'; // TPP or FPP
        function updateCameraPosition() {
            if (cameraMode === 'TPP') {
                camera.position.set(jetGroup.position.x, jetGroup.position.y + 4, jetGroup.position.z + 14);
                camera.lookAt(jetGroup.position.x, jetGroup.position.y + 1, jetGroup.position.z - 20);
            } else {
                camera.position.set(jetGroup.position.x, jetGroup.position.y + 0.8, jetGroup.position.z - 0.5);
                camera.lookAt(jetGroup.position.x, jetGroup.position.y + 0.8, jetGroup.position.z - 50);
            }
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(100, 150, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 2. REALISTIC CITY ENVIRONMENT WITH ROADS & BUILDINGS ---
        const cityGroup = new THREE.Group();
        const obstacleBoxes = [];

        // Window Texture Generator for Buildings
        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#64748b'; // Gray building background
            ctx.fillRect(0, 0, 128, 128);

            ctx.fillStyle = '#334155'; // Dark window squares
            for (let y = 8; y < 128; y += 16) {
                for (let x = 8; x < 128; x += 16) {
                    ctx.fillRect(x, y, 8, 10);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        const windowTexture = createBuildingTexture();
        windowTexture.wrapS = THREE.RepeatWrapping;
        windowTexture.wrapT = THREE.RepeatWrapping;

        function buildCityGrid() {
            while (cityGroup.children.length > 0) {
                cityGroup.remove(cityGroup.children[0]);
            }
            obstacleBoxes.length = 0;

            // Ground Asphalt Road
            const roadGeo = new THREE.PlaneGeometry(30, 1200);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, -0.1, -500);
            cityGroup.add(road);

            // White Center Road Line Markings
            for (let z = 0; z > -1100; z -= 15) {
                const stripeGeo = new THREE.PlaneGeometry(0.8, 6);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, 0, z);
                cityGroup.add(stripe);
            }

            // Side Grass Strips
            const grassGeo = new THREE.PlaneGeometry(200, 1200);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x4ac057, roughness: 0.9 });
            const grassL = new THREE.Mesh(grassGeo, grassMat);
            grassL.rotation.x = -Math.PI / 2;
            grassL.position.set(-115, -0.2, -500);
            cityGroup.add(grassL);

            const grassR = grassL.clone();
            grassR.position.x = 115;
            cityGroup.add(grassR);

            // Buildings on Left and Right of Road (Reference Style)
            for (let z = -40; z > -1000; z -= 35) {
                // Generate buildings on left and right side
                [-1, 1].forEach(side => {
                    const h = Math.random() * 35 + 20;
                    const w = Math.random() * 8 + 14;
                    const d = Math.random() * 8 + 16;
                    const x = side * (18 + w / 2 + Math.random() * 4);

                    const tex = windowTexture.clone();
                    tex.repeat.set(2, Math.floor(h / 6));

                    const bMat = new THREE.MeshStandardMaterial({
                        map: tex,
                        color: 0x94a3b8,
                        roughness: 0.5
                    });

                    const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat);
                    building.position.set(x, h / 2, z);
                    building.castShadow = true;
                    building.receiveShadow = true;

                    cityGroup.add(building);
                    obstacleBoxes.push({ mesh: building, width: w, height: h, depth: d });
                });

                // Occasional Overhead Obstacle Bridge across road
                if (Math.random() > 0.65 && z < -100) {
                    const bridgeH = Math.random() * 8 + 12;
                    const bridge = new THREE.Mesh(
                        new THREE.BoxGeometry(32, 4, 8),
                        new THREE.MeshStandardMaterial({ color: 0xef4444 })
                    );
                    bridge.position.set(0, bridgeH, z);
                    cityGroup.add(bridge);
                    obstacleBoxes.push({ mesh: bridge, width: 32, height: 4, depth: 8 });
                }
            }
        }
        buildCityGrid();
        scene.add(cityGroup);

        // --- 3. WHITE JET AIRCRAFT (Reference Model) ---
        const jetGroup = new THREE.Group();

        const planeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2, metalness: 0.5 });
        const planeRedMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });

        // Fuselage Body
        const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 4.5, 16), planeWhiteMat);
        fuselage.rotation.x = Math.PI / 2;
        jetGroup.add(fuselage);

        // Nose
        const nose = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.5, 16), planeWhiteMat);
        nose.rotation.x = -Math.PI / 2;
        nose.position.z = -2.8;
        jetGroup.add(nose);

        // Main Wings
        const wingGeo = new THREE.BoxGeometry(6.0, 0.08, 1.2);
        const mainWings = new THREE.Mesh(wingGeo, planeWhiteMat);
        mainWings.position.set(0, 0, -0.2);
        jetGroup.add(mainWings);

        // Red Wingtips
        const tipL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 1.2), planeRedMat);
        tipL.position.set(-3.1, 0, -0.2);
        jetGroup.add(tipL);

        const tipR = tipL.clone();
        tipR.position.x = 3.1;
        jetGroup.add(tipR);

        // Tail Fin
        const tailFin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 0.8), planeRedMat);
        tailFin.position.set(0, 0.6, 1.8);
        jetGroup.add(tailFin);

        jetGroup.position.set(0, 6, 0);
        scene.add(jetGroup);

        // --- 4. GAME STATE & CONTROLS ---
        let isPaused = false;
        let isGameOver = false;
        let speed = 288; // Default reference speed (KM/H)
        let planePos = { x: 0, y: 6 };
        let targetPitch = 0, targetRoll = 0;
        let currentPitch = 0, currentRoll = 0;
        let scoreDistance = 0;

        // Button Event Handlers
        document.getElementById('view-btn').addEventListener('click', () => {
            cameraMode = (cameraMode === 'TPP') ? 'FPP' : 'TPP';
            document.getElementById('view-btn').innerText = `View: ${cameraMode}`;
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
        });

        document.getElementById('restart-bar-btn').addEventListener('click', resetGame);
        document.getElementById('restart-overlay-btn').addEventListener('click', resetGame);

        document.getElementById('recenter-btn').addEventListener('click', () => {
            planePos.x = 0;
            planePos.y = 6;
            targetPitch = 0;
            targetRoll = 0;
        });

        const modal = document.getElementById('controls-modal');
        document.getElementById('controls-btn').addEventListener('click', () => modal.style.display = 'block');
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.style.display = 'none');

        function resetGame() {
            document.getElementById('gameover-overlay').style.display = 'none';
            planePos = { x: 0, y: 6 };
            jetGroup.position.set(0, 6, 0);
            jetGroup.rotation.set(0, 0, 0);
            cityGroup.position.z = 0;
            scoreDistance = 0;
            isGameOver = false;
            isPaused = false;
            buildCityGrid();
        }

        // Key Handlers
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function processKeyboardInput() {
            if (isGameOver || isPaused) return;

            // Roll / Horizontal Flight
            if (keys['ArrowLeft'] || keys['KeyA']) {
                planePos.x -= 0.35;
                targetRoll = -25;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                planePos.x += 0.35;
                targetRoll = 25;
            } else if (!espConnected) {
                targetRoll = 0;
            }

            // Pitch / Vertical Flight
            if (keys['ArrowUp'] || keys['KeyW']) {
                planePos.y = Math.min(28, planePos.y + 0.3);
                targetPitch = -18;
            } else if (keys['ArrowDown'] || keys['KeyS']) {
                planePos.y = Math.max(1.5, planePos.y - 0.3);
                targetPitch = 18;
            } else if (!espConnected) {
                targetPitch = 0;
            }

            // Horizontal Flight Constraints
            planePos.x = Math.max(-22, Math.min(22, planePos.x));
        }

        // --- 5. ESP32 HARDWARE SERIAL LINK ---
        let espConnected = false;
        document.getElementById('connect-btn').addEventListener('click', async () => {
            if ('serial' in navigator) {
                try {
                    const port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                    espConnected = true;

                    document.getElementById('connect-btn').innerText = "Connected";
                    document.getElementById('connect-btn').style.background = "#38bdf8";

                    const textDecoder = new TextDecoderStream();
                    port.readable.pipeTo(textDecoder.writable);
                    const reader = textDecoder.readable.getReader();

                    let buffer = "";
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buffer += value;
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            const parts = line.trim().split(',');
                            parts.forEach(part => {
                                const [k, v] = part.split(':');
                                if (k === 'P') { targetPitch = parseFloat(v) || 0; planePos.y -= targetPitch * 0.02; }
                                if (k === 'R') { targetRoll = parseFloat(v) || 0; planePos.x += targetRoll * 0.02; }
                            });
                        }
                    }
                } catch (e) { alert("Serial Connection Error."); }
            }
        });

        // --- 6. COLLISION LOGIC ---
        function checkCollisions() {
            if (isGameOver || isPaused) return;

            const pX = jetGroup.position.x;
            const pY = jetGroup.position.y;

            for (let b of obstacleBoxes) {
                const bZ = b.mesh.position.z + cityGroup.position.z;

                if (Math.abs(bZ) < 3.0) {
                    const bX = b.mesh.position.x;
                    const bY = b.mesh.position.y;

                    if (Math.abs(pX - bX) < (b.width / 2 + 1.8) && Math.abs(pY - bY) < (b.height / 2 + 0.8)) {
                        isGameOver = true;
                        document.getElementById('gameover-overlay').style.display = 'flex';
                        document.getElementById('final-dist-txt').innerText = `DISTANCE TRAVELED: ${Math.round(scoreDistance)} M`;
                        break;
                    }
                }
            }
        }

        // --- 7. ANIMATION RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused && !isGameOver) {
                processKeyboardInput();

                // Smooth Motion
                jetGroup.position.x += (planePos.x - jetGroup.position.x) * 0.15;
                jetGroup.position.y += (planePos.y - jetGroup.position.y) * 0.15;

                currentPitch += (targetPitch - currentPitch) * 0.1;
                currentRoll += (targetRoll - currentRoll) * 0.1;

                jetGroup.rotation.x = THREE.MathUtils.degToRad(currentPitch);
                jetGroup.rotation.z = THREE.MathUtils.degToRad(-currentRoll);

                // Move City Environment towards Plane
                const moveStep = (speed / 3.6) * 0.025;
                cityGroup.position.z += moveStep;
                scoreDistance += moveStep;

                if (cityGroup.position.z > 800) {
                    cityGroup.position.z = 0;
                }

                checkCollisions();
            }

            updateCameraPosition();

            // Update Telemetry Header & Score Display
            document.getElementById('speed-val').innerText = `${Math.round(speed)} km/h`;
            document.getElementById('alt-val').innerText = `${Math.round(jetGroup.position.y * 5)} m`;
            document.getElementById('heading-val').innerText = `${String(Math.abs(Math.round(jetGroup.position.x * 4))).padStart(3, '0')}°`;
            document.getElementById('score-val').innerText = `${Math.round(scoreDistance)} m`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
